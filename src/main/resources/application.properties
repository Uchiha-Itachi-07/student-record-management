# ---------------------------------------------------------------------------
# Server
# ---------------------------------------------------------------------------
server.port=8080

# ---------------------------------------------------------------------------
# H2 in-memory database
# (swap this whole block out for MySQL settings below if you want a real DB)
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:srmsdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Auto-create/drop schema from the JPA entity on every restart (fine for a demo).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 web console at http://localhost:8080/h2-console
# JDBC URL to paste in there: jdbc:h2:mem:srmsdb
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------------------------------------------------------------------------
# MySQL alternative — comment out the H2 block above and uncomment this
# (create the DB first: CREATE DATABASE srmsdb;)
# ---------------------------------------------------------------------------
# spring.datasource.url=jdbc:mysql://localhost:3306/srmsdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=yourpassword
# spring.jpa.hibernate.ddl-auto=update
# spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
# (and add the mysql-connector-j dependency to pom.xml)

# ---------------------------------------------------------------------------
# Return cleaner error payloads
# ---------------------------------------------------------------------------
server.error.include-message=always
server.error.include-binding-errors=always
